[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "letterboxd-blend"
version = "0.1.0"
description = "Blend two people's Letterboxd data to recommend movies they'd both like."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
letterboxd-blend = "letterboxd_blend.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/letterboxd_blend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
